name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install (no deps required)
        run: npm install --ignore-scripts
      - name: Test
        run: npm test
      - name: CLI validate sample
        run: node bin/cli.js validate examples/payloads/order-shipped.json
      - name: CLI decrypt-notify sample
        run: node bin/cli.js decrypt-notify examples/payloads/pay-notify-v3.json --lab-key
